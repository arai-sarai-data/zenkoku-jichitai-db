name: ingest-browser

# 国内ブラウザ巡回の結果(Issue「browser-crawl <団体コード> <名前>」)を results ブランチに取り込む。
on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: ingest-browser
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'browser-crawl ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 取り込む
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin results
          git worktree add -q /tmp/prev FETCH_HEAD
          touch /tmp/marker
          python tools/ingest_issues.py /tmp/prev
          git worktree remove --force /tmp/prev
          for f in $(find data/status -name '*.csv' -newer /tmp/marker); do
            bash crawler/push_partial.sh "$(basename "$f" .csv)"
          done
      - name: 取り込み済みのIssue番号を記録
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/browser_ingested.txt
          git commit -qm "国内ブラウザ巡回の取り込み記録 [skip ci]" || exit 0
          git pull -q --rebase && git push -q
