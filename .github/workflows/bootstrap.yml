{"name": "bootstrap", "on": {"push": {"branches": ["main"], "paths": [".github/workflows/bootstrap.yml"]}}, "permissions": {"contents": "write"}, "jobs": {"b": {"runs-on": "ubuntu-latest", "env": {"SRC": "${{ secrets.SRC_URL }}", "GH_TOKEN": "${{ github.token }}"}, "steps": [{"run": "set -e\ngit config --global user.name collector-bot\ngit config --global user.email collector-bot@users.noreply.github.com\ngit clone -q \"https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}\" dst\ncd dst\ngit fetch -q \"$SRC\" migrate-main:mm migrate-results:results\nfor p in $(git ls-tree --name-only mm); do [ \"$p\" = .github ] || git checkout mm -- \"$p\"; done\nmkdir -p pending-workflows\nfor f in $(git ls-tree --name-only mm .github/workflows/); do git show \"mm:$f\" > \"pending-workflows/$(basename \"$f\")\"; done\ngit add -A\ngit commit -qm \"初期取り込み\"\ngit push -q origin HEAD:main\ngit push -q origin results\ngit ls-files | wc -l\n"}]}}}
