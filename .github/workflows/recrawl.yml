name: recrawl

# 失敗・不足した団体だけを再巡回し、results ブランチの結果に差し替える。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "failed=失敗した団体のみ / missing=原本0件の種類がある団体も"
        default: "failed"
  workflow_run:
    workflows: ["collect-originals"]
    types: [completed]

permissions:
  contents: write

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin results && git worktree add -q /tmp/prev FETCH_HEAD
      - id: p
        run: echo "matrix=$(python crawler/recrawl_plan.py /tmp/prev ${{ github.event.inputs.mode || 'failed' }})" >> "$GITHUB_OUTPUT"

  master:
    needs: plan
    if: contains(needs.plan.outputs.matrix, 'pref')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests openpyxl
      - run: python crawler/build_master.py
      - uses: actions/upload-artifact@v4
        with: { name: master, path: data/master.csv }

  crawl:
    needs: [plan, master]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests lxml openpyxl pypdf urllib3 playwright && python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: master, path: data }
      - name: 再巡回
        env:
          ONLY_CODES: ${{ matrix.codes }}
        run: python crawler/discover.py ${{ matrix.pref }}
      - name: 前回の結果と団体単位で合わせて保存
        run: |
          git fetch -q origin results && git worktree add -q /tmp/prev FETCH_HEAD
          python crawler/merge_results.py ${{ matrix.pref }} /tmp/prev
          git worktree remove --force /tmp/prev
          bash crawler/push_partial.sh ${{ matrix.pref }}

  publish:
    needs: crawl
    if: always() && needs.crawl.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: results ブランチの最新を main の data/ に反映
        run: |
          git fetch -q origin results && git worktree add -q /tmp/res FETCH_HEAD
          mkdir -p data/links data/status data/docs
          cp /tmp/res/links/*.csv data/links/ 2>/dev/null || true
          cp /tmp/res/status/*.csv data/status/ 2>/dev/null || true
          cp /tmp/res/docs/*.csv data/docs/ 2>/dev/null || true
          git worktree remove --force /tmp/res
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/links data/status data/docs
          git commit -m "recrawl: $(date +%Y-%m-%d) [skip ci]" || echo "no changes"
          # 同時に別の処理が main に書き込んだ場合は、最新の main の上に results の内容を置き直して再送する
          # (data/ は results ブランチが正本なので、結合せずに上書きでよい)
          mkdir -p /tmp/keep && for d in links status docs; do cp -r data/$d /tmp/keep/; done
          for i in 1 2 3 4 5 6; do
            git push && exit 0
            sleep $((i * 10))
            git fetch -q origin main && git reset -q --hard origin/main
            for d in links status docs; do mkdir -p data/$d && cp /tmp/keep/$d/*.csv data/$d/ 2>/dev/null || true; done
            git add data/links data/status data/docs
            git commit -q -m "recrawl: $(date +%Y-%m-%d) [skip ci]" || exit 0
          done
          exit 1
