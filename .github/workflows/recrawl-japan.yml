name: recrawl-japan

# 海外(GitHubのサーバー)からのアクセスを断る自治体だけを、日本国内のPC(self-hosted runner, ラベル japan)から集め直す。
# PCの電源が切れている間は待機し、起動したときに処理される。
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["recrawl"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: recrawl-japan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin results && git worktree add -q /tmp/prev FETCH_HEAD
      - id: p
        run: echo "matrix=$(python crawler/recrawl_plan.py /tmp/prev failed)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: contains(steps.p.outputs.matrix, 'pref')
        with: { python-version: "3.12" }
      - name: 自治体マスタ
        if: contains(steps.p.outputs.matrix, 'pref')
        run: pip install requests openpyxl && python crawler/build_master.py
      - uses: actions/upload-artifact@v4
        if: contains(steps.p.outputs.matrix, 'pref')
        with: { name: master, path: data/master.csv }

  crawl-from-japan:
    needs: plan
    if: contains(needs.plan.outputs.matrix, 'pref')
    runs-on: [self-hosted, japan]
    timeout-minutes: 600
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: PCのPythonを使う(PCはPowerShellのスクリプト実行が禁止のため setup-python は使わない)
        shell: cmd
        run: |
          where py >nul 2>&1 && (echo PY=py -3>>"%GITHUB_ENV%") || (echo PY=python>>"%GITHUB_ENV%")
      - shell: cmd
        run: '%PY% -m pip install --user requests lxml openpyxl pypdf urllib3'
      - uses: actions/download-artifact@v4
        with: { name: master, path: data }
      - name: 日本国内から再巡回
        shell: cmd
        env:
          ONLY_CODES: ${{ matrix.codes }}
          PYTHONIOENCODING: utf-8
        run: '%PY% crawler/discover.py ${{ matrix.pref }}'
      - uses: actions/upload-artifact@v4
        with:
          name: jp-${{ matrix.pref }}
          path: |
            data/links/${{ matrix.pref }}.csv
            data/status/${{ matrix.pref }}.csv

  merge:
    needs: crawl-from-japan
    if: ${{ !cancelled() && needs.crawl-from-japan.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { pattern: "jp-*", path: dl }
      - name: 前回の結果に団体単位で差し替えて保存
        run: |
          git fetch -q origin results && git worktree add -q /tmp/prev FETCH_HEAD
          for d in dl/jp-*; do
            p=${d#dl/jp-}
            mkdir -p data/links data/status
            cp $d/data/links/$p.csv data/links/ 2>/dev/null || cp $d/links/$p.csv data/links/ 2>/dev/null || true
            cp $d/data/status/$p.csv data/status/ 2>/dev/null || cp $d/status/$p.csv data/status/ 2>/dev/null || true
            python crawler/merge_results.py $p /tmp/prev
            bash crawler/push_partial.sh $p
          done
      - name: results ブランチの最新を main の data/ に反映
        run: |
          git fetch -q origin results && git worktree add -q /tmp/res FETCH_HEAD
          cp /tmp/res/links/*.csv data/links/ 2>/dev/null || true
          cp /tmp/res/status/*.csv data/status/ 2>/dev/null || true
          git worktree remove --force /tmp/res
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/links data/status
          git commit -m "recrawl-japan: $(date +%Y-%m-%d) [skip ci]" || echo "no changes"
          git pull --rebase && git push
