name: saita-daily

# サイタくん(www.subsidy-support.tech)の補助金データを「確認用」にだけ使う。
# 公開リポジトリには置かず(再配布しない)、Actionsの成果物として一時保存する。
# 自前の巡回結果(data/links)と突き合わせ、取りこぼした団体と原本URLを洗い出す。

on:
  workflow_dispatch:
  schedule:
    - cron: "43 21 * * *"   # 毎日 06:43 (日本時間)

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python crawler/compare_saita.py
      - uses: actions/upload-artifact@v4
        with:
          name: saita-check
          path: |
            data/saita/
            data/compare/
          retention-days: 30
